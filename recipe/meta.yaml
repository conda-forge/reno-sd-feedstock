{% set name = "reno-sd" %}
{% set python_min = "3.12" %}
{% set version = "0.15.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/reno_sd-{{ version }}.tar.gz
  sha256: cdf5c1bc3144e9c854ede4e64fefcde1d57232ae789203b85d3d866ba10c767e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy
    - pandas
    - xarray
    - panel
    - pymc >=6
    - matplotlib-base
    - selenium
    - ipyvuetify
    - python-graphviz

test:
  imports:
    - reno
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/ORNL/reno
  summary: System dynamics modeling with bayesian inference
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://ornl.github.io/reno/stable/index.html

extra:
  recipe-maintainers:
    - WarmCyan
